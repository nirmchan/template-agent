name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"

    - name: Set up virtual env
      run: uv venv --python ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        uv pip install -e ".[dev]"

    - name: Run unit tests with coverage
      env:
        GOOGLE_APPLICATION_CREDENTIALS_CONTENT: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_CONTENT }}
      run: |
        source .venv/bin/activate && pytest tests/unit --cov=deep_agent --cov-report=xml --cov-report=term-missing --cov-fail-under=19

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  skills-evals:
    name: Skills Evaluations
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"

    - name: Set up virtual env
      run: uv venv --python ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        uv pip install -e ".[dev]"

    - name: Run skills evals
      env:
        GOOGLE_APPLICATION_CREDENTIALS_CONTENT: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_CONTENT }}
        GOOGLE_GENAI_API_KEY: ${{ secrets.GOOGLE_GENAI_API_KEY }}
      run: |
        source .venv/bin/activate && pytest tests/skills -m skills -v

    - name: Upload skills eval results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: skills-eval-results
        path: tests/workspaces/

  agent-evals-promptfoo:
    name: Agent Evals (Promptfoo)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
        node-version: ["20"]

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: pgvector
          POSTGRES_PASSWORD: pgvector
          POSTGRES_DB: pgvector
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"

    - name: Set up Python virtual env
      run: uv venv --python ${{ matrix.python-version }}

    - name: Install Python dependencies
      run: |
        uv pip install -e ".[dev]"

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Start agent server
      env:
        GOOGLE_APPLICATION_CREDENTIALS_CONTENT: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_CONTENT }}
        GOOGLE_GENAI_API_KEY: ${{ secrets.GOOGLE_GENAI_API_KEY }}
        POSTGRES_USER: pgvector
        POSTGRES_PASSWORD: pgvector
        POSTGRES_DB: pgvector
        POSTGRES_HOST: localhost
        POSTGRES_PORT: 5432
        AGENT_HOST: 0.0.0.0
        AGENT_PORT: 5002
      run: |
        source .venv/bin/activate
        python -m deep_agent.src.main &
        echo $! > agent.pid
        sleep 10  # Wait for agent to start

    - name: Health check
      run: |
        curl -f http://localhost:5002/health || exit 1

    - name: Run Promptfoo evals
      env:
        AGENT_URL: http://localhost:5002
      working-directory: config/agent/evals/promptfoo
      run: |
        npx promptfoo@latest eval --output ../../../promptfoo-results.json

    - name: Stop agent server
      if: always()
      run: |
        if [ -f agent.pid ]; then
          kill $(cat agent.pid) || true
        fi

    - name: Upload Promptfoo results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: promptfoo-results
        path: promptfoo-results.json
