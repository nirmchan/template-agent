apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Deploy eval-runner alongside the agent in the same namespace.
# Apply after the agent overlay: kubectl apply -k deployment/overlays/openshift
# Then: kubectl apply -k eval-runner/deployment/overlays/openshift
#
# Prerequisites:
#   - agent-config ConfigMap and agent-secrets Secret must exist (from agent overlay)
#   - KEDA HTTP Add-on operator installed (for HTTPScaledObject scale-to-zero)

resources:
  - ../../base
  - buildconfig.yaml
  - imagestream.yaml
  - deployment.yaml
  - scaledobject.yaml

labels:
  - pairs:
      app: eval-runner
      component: eval-runner

images:
  - name: eval-runner
    newTag: latest
