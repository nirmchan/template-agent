apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: template-agent

# Apply after the agent kind overlay:
#   kubectl apply -k deployment/overlays/kind
#   kubectl apply -k eval-runner/deployment/overlays/kind
#
# Build the image first:
#   podman build -f eval-runner/Containerfile -t localhost/template-agent-eval:local eval-runner/
#   kind load docker-image localhost/template-agent-eval:local

resources:
  - ../../base
  - deployment.yaml

labels:
  - pairs:
      app: eval-runner
      component: eval-runner
