## Demo Stack: Agent + MCP Server with SSO Authentication
## Demonstrates end-to-end SSO token propagation: User → Agent → MCP Server
##
## Usage:
##   make demo          - Clone MCP server, configure, start everything
##   make demo-down     - Stop demo stack
##   make demo-clean    - Stop and remove all data + cloned repo
##   make demo-logs     - Tail all logs
##
## Services:
##   pgvector              - Shared Postgres (agent checkpoints + MCP token storage)
##   redis                 - Aegra broker (SSE streaming, job queue)
##   jaeger                - OpenTelemetry tracing
##   template-mcp-server   - MCP server with SSO auth (port 5001)
##   template-agent        - Agent with SSO auth + token propagation (port 5002)

services:
  pgvector:
    image: ankane/pgvector
    container_name: demo-pgvector
    environment:
      POSTGRES_DB: template_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - demo_pgvector_data:/var/lib/postgresql/data
      - ./.demo/init-databases.sql:/docker-entrypoint-initdb.d/10-create-databases.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d template_agent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - demo-network

  redis:
    image: redis:7-alpine
    container_name: demo-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - demo_redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - demo-network

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: demo-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    restart: unless-stopped
    networks:
      - demo-network

  template-mcp-server:
    build:
      context: .demo/template-mcp-server
      dockerfile: Containerfile
    container_name: demo-mcp-server
    ports:
      - "5001:5001"
    env_file:
      - .demo/mcp-server.env
    environment:
      - MCP_HOST=0.0.0.0
      - MCP_PORT=5001
      - ENABLE_AUTH=True
      - POSTGRES_HOST=pgvector
      - POSTGRES_PORT=5432
      - POSTGRES_DB=mcp_server
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    depends_on:
      pgvector:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "-k", "http://0.0.0.0:5001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - demo-network

  template-agent:
    build:
      context: .
      dockerfile: Containerfile
    container_name: demo-agent
    ports:
      - "5002:5002"
    env_file:
      - .env
    environment:
      - AGENT_PORT=5002
      - POSTGRES_HOST=pgvector
      - POSTGRES_PORT=5432
      - POSTGRES_DB=template_agent
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - REDIS_URL=redis://redis:6379/0
      - REDIS_BROKER_ENABLED=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_SERVICE_NAME=template-agent
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=none
      - OTEL_LOGS_EXPORTER=none
      - ENVIRONMENT=development
      - ENV_MODE=PRODUCTION
      - NO_COLOR=1
      - LOG_LEVEL=DEBUG
    depends_on:
      pgvector:
        condition: service_healthy
      redis:
        condition: service_healthy
      template-mcp-server:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://0.0.0.0:5002/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - ./deep_agent:/app/deep_agent:ro
      - ./config:/app/config:ro
      - ./.demo/mcp.json:/app/config/agent/mcp.json:ro
    networks:
      - demo-network

volumes:
  demo_pgvector_data:
    driver: local
  demo_redis_data:
    driver: local

networks:
  demo-network:
    driver: bridge
