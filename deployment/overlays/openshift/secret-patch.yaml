apiVersion: v1
kind: Secret
metadata:
  name: agent-secrets
type: Opaque
stringData:
  # OpenShift-specific secrets (fills in base template)
  SSL_KEYFILE: ""
  SSL_CERTFILE: ""

  # Note: OTEL_EXPORTER_OTLP_ENDPOINT is in configmap-patch.yaml
  # Default: http://jaeger:4318 (in-cluster Jaeger)
  # To use external collector: override OTEL_EXPORTER_OTLP_ENDPOINT in configmap-patch.yaml
