apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-config
data:
  # OpenShift-specific config
  AGENT_HOST: "0.0.0.0"
  AGENT_PORT: "5002"
  PYTHON_LOG_LEVEL: "INFO"
  LANGFUSE_TRACING_ENVIRONMENT: "production"
  REQUEST_LOGGING_ENABLED: "true"
  REQUEST_LOG_HEADERS: "true"
  REQUEST_LOG_BODY: "false"
  REQUEST_LOG_BODY_MAX_SIZE: "10240"

  # Redis (inherits from base, can override)
  REDIS_HOST: "redis"
  REDIS_MAX_CONNECTIONS: "20"

  # OTEL (inherits from base)
  OTEL_SERVICE_NAME: "template-agent-openshift"
