apiVersion: v1
kind: Service
metadata:
  name: jaeger
  labels:
    app: agent
    component: observability
spec:
  type: ClusterIP
  ports:
    - port: 16686
      targetPort: 16686
      protocol: TCP
      name: ui
    - port: 4317
      targetPort: 4317
      protocol: TCP
      name: otlp-grpc
    - port: 4318
      targetPort: 4318
      protocol: TCP
      name: otlp-http
    - port: 14250
      targetPort: 14250
      protocol: TCP
      name: model-proto
  selector:
    app: agent
    component: observability
