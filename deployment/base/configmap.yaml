apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-config
data:
  # PostgreSQL Configuration
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "template_agent"

  # Redis Configuration
  REDIS_URL: "redis://redis:6379/0"

  # Config Path (for base image pattern - override in deployment if using custom mount)
  # Default: /app/config/agent (matches Containerfile.base ENV)
  # Override this if you mount config to a different path
  CONFIG_PATH: "/app/config/agent"
