## Docker Compose for aegra (LangGraph Platform) deployment with deep-agents-ui.
##
## Usage:
##   langgraph up -d compose.aegra.yaml --port 2024
##
## Or standalone (without langgraph CLI):
##   docker compose -f compose.aegra.yaml up --build
##
## Services:
##   pgvector       — Postgres with pgvector for checkpointing
##   mock-mcp       — Stub MCP server (tools: calculate_bmi, validate_email, etc.)
##   deep-agents-ui — Next.js UI from langchain-ai/deep-agents-ui

services:
  pgvector:
    image: ankane/pgvector
    container_name: aegra-pgvector
    environment:
      POSTGRES_DB: langgraph
      POSTGRES_USER: langgraph
      POSTGRES_PASSWORD: langgraph
    volumes:
      - aegra_pgdata:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langgraph -d langgraph"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - aegra-network

  mock-mcp:
    build:
      context: .
      dockerfile: Containerfile
    container_name: aegra-mock-mcp
    command: ["/app/.venv/bin/python", "tests/mocks/mock_mcp_server.py"]
    ports:
      - "5001:5001"
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://0.0.0.0:5001/health"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aegra-network

  deep-agents-ui:
    build:
      context: ./deep-agents-ui
      dockerfile: ../deep-agents-ui.Dockerfile
    container_name: aegra-ui
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_DEFAULT_DEPLOYMENT_URL=http://localhost:2024
      - NEXT_PUBLIC_DEFAULT_ASSISTANT_ID=agent
    depends_on:
      - pgvector
    restart: always
    networks:
      - aegra-network

volumes:
  aegra_pgdata:
    driver: local

networks:
  aegra-network:
    driver: bridge
