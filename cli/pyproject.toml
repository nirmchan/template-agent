[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist.force-include]
"../deep_agent/cli" = "deep_agent/cli"

[tool.hatch.build.targets.wheel.force-include]
"deep_agent/cli" = "deep_agent/cli"

[project]
name = "deep-agent-cli"
version = "0.1.0"
description = "Standalone CLI chat client for Deep Agent"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15.0",
    "rich>=14.0.0",
    "httpx>=0.27.0",
    "PyJWT[crypto]>=2.8.0",
]

[project.scripts]
ask = "deep_agent.cli:app"

[project.urls]
Repository = "https://github.com/redhat-data-and-ai/template-agent"
