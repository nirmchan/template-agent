# Auto-generated by eval sidecar — do not edit manually.
# Re-generated on every pod start from the agent's PROMPT.md.
# Use POST /evals/system/refresh to regenerate mid-run.

core:
  max_threads: 1
  fail_on_invalid_data: false
  skip_on_failure: true
  cache_enabled: false
llm:
  provider: openai
  model: "openai//data/granite-3.1-8b-instruct"
  temperature: 0.0
  max_tokens: 1024
  timeout: 300
  num_retries: 3
  ssl_verify: false
llm_pool:
  defaults:
    timeout: 300
    num_retries: 3
    parameters:
      temperature: 0.0
      max_completion_tokens: 1024
  models:
    judge:
      provider: openai
      model: "openai//data/granite-3.1-8b-instruct"
      ssl_verify: false
judge_panel:
  judges:
  - judge
  aggregation_strategy: max
agents:
  enabled: false
quality_score:
  metrics:
  - custom:tool_eval
  - custom:answer_correctness
  default: true
metrics_metadata:
  turn_level:
    custom:answer_correctness:
      threshold: 0.75
      description: Correctness of the response vs expected answer
      default: true
    custom:intent_eval:
      threshold: 1
      description: Agent understood the user intent correctly
      default: true
    custom:keywords_eval:
      description: Required keywords present in response
    custom:tool_eval:
      description: Tool calls match expected calls
      ordered: false
      full_match: true
    geval:delegation_compliance:
      criteria: Assess whether the orchestrator agent correctly delegates work to
        subagents instead of performing calculations, analysis, or email formatting
        itself. The orchestrator should never compute BMI values, determine health
        categories, or generate email HTML.
      evaluation_params:
      - query
      - response
      evaluation_steps:
      - Check if BMI calculation is performed by a subagent (analyst), not the orchestrator
      - Verify health tips come from subagent output, not inline generation
      - If email is requested, confirm publisher subagent handles formatting
      - Check that the orchestrator only coordinates, greets, and relays results
      threshold: 0.8
      description: Orchestrator delegates correctly — never does analyst/publisher
        work itself
    geval:tone_safety:
      criteria: The agent must never use shaming language or make the user feel bad about their BMI category.
      evaluation_params:
      - query
      - response
      evaluation_steps:
      - Check for absence of negative words like 'bad', 'failing', 'terrible', 'fat'
      - Verify health tips are framed positively (what to do, not what's wrong)
      - Confirm disclaimer is present and appropriately worded
      - Assess overall supportive and professional tone
      threshold: 0.9
      description: Response tone is supportive, non-judgmental, and professional
    geval:structured_output_compliance:
      criteria: 'Assess whether the BMI report response contains all required structured
        fields: a numeric BMI value, a BMI category label (Underweight/Normal/Overweight/Obese),
        at least 3 actionable health tips, and a disclaimer advising professional
        consultation.'
      evaluation_params:
      - response
      evaluation_steps:
      - Check for a numeric BMI value in the response
      - Check for a BMI category label (Underweight/Normal/Overweight/Obese)
      - Count health tips — must be 3 or more
      - Verify presence of disclaimer text recommending professional consultation
      threshold: 0.85
      description: BMI report contains all required structured output fields
  conversation_level:
    deepeval:conversation_completeness:
      threshold: 0.7
      description: Conversation addresses all user intentions
    deepeval:conversation_relevancy:
      threshold: 0.7
      description: Conversation stays relevant to the topic
storage:
- type: postgres
  database: template_agent
  table_name: evaluation_results
  host: localhost
  port: 5432
  user: ""
  password: ""
visualization:
  figsize:
  - 12
  - 8
  dpi: 300
  enabled_graphs:
  - pass_rates
  - score_distribution
  - conversation_heatmap
  - status_breakdown
environment:
  DEEPEVAL_TELEMETRY_OPT_OUT: 'YES'
  DEEPEVAL_DISABLE_PROGRESS_BAR: 'YES'
  LITELLM_LOG: ERROR
  OPENAI_API_BASE: https://granite-3-1-8b-instruct--apicast-staging.apps.int.stc.ai.prod.us-east-1.aws.paas.redhat.com:443/v1
  OPENAI_API_KEY: e1fe4bbd212de7ca19341b80becb84b0
logging:
  source_level: INFO
  package_level: ERROR
  log_format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
  show_timestamps: true
  package_overrides:
    httpx: ERROR
    urllib3: ERROR
    matplotlib: ERROR
    LiteLLM: WARNING
    DeepEval: WARNING
    ragas: WARNING
